name: Build visits app (Android)

on:
  push:
    paths:
      - 'visits-app/**'
      - '.github/workflows/visits-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: visits-app
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../visits-planner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: visits-planner-apk
          path: visits-planner.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: visits-app-latest
          name: تطبيق خطة الزيارات (آخر نسخة)
          body: |
            حمّل `visits-planner.apk` من تحت وافتحه على الموبايل (اسمح بالتثبيت من مصادر غير معروفة).
            Build ${{ github.run_number }} — ${{ github.sha }}
          prerelease: true
          files: visits-planner.apk
