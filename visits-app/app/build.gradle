plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.ahmed.visits'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ahmed.visits'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // One fixed key so every new APK installs over the old one and keeps your data.
    signingConfigs {
        shared {
            storeFile file('visits.keystore')
            storePassword 'visits-app'
            keyAlias 'visits'
            keyPassword 'visits-app'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
